name: Scid vs PC macOS compaction test

on:
  workflow_dispatch:
    inputs:
      revs:
        description: "SVN revisions (JSON list)"
        default: '["3724"]'
      tks:
        description: "Tcl/Tk versions to build (JSON list)"
        default: '["8.6.16", "8.6.13", "8.6.10"]'
      patch:
        description: "optional patch file in patches/ to apply (empty = none)"
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
        rev: ${{ fromJSON(github.event.inputs.revs) }}
        tk: ${{ fromJSON(github.event.inputs.tks) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build Tcl/Tk 8.6 frameworks (Aqua), install Subversion
        run: |
          brew install subversion tcl-tk@8
          # only used as the tclsh 8.6 that "make install" needs for the html docs
          export NATIVE_TCLSH=$(brew --prefix tcl-tk@8)/bin/tclsh8.6
          V=${{ matrix.tk }}
          curl -sSL -o tcl.tgz https://prdownloads.sourceforge.net/tcl/tcl$V-src.tar.gz
          curl -sSL -o tk.tgz https://prdownloads.sourceforge.net/tcl/tk$V-src.tar.gz
          mkdir tcltk && tar xzf tcl.tgz -C tcltk && tar xzf tk.tgz -C tcltk
          cd tcltk
          mv tcl$V tcl8.6 && mv tk$V tk8.6
          make -C tcl8.6/macosx -j4 > ../tcl-build.log 2>&1 || (tail -40 ../tcl-build.log; exit 1)
          sudo make -C tcl8.6/macosx install NATIVE_TCLSH=$NATIVE_TCLSH > ../tcl-install.log 2>&1 || (tail -40 ../tcl-install.log; exit 1)
          make -C tk8.6/macosx -j4 > ../tk-build.log 2>&1 || (tail -40 ../tk-build.log; exit 1)
          sudo make -C tk8.6/macosx install NATIVE_TCLSH=$NATIVE_TCLSH > ../tk-install.log 2>&1 || (tail -40 ../tk-install.log; exit 1)
          ls /Library/Frameworks

      - name: Get Scid vs PC r${{ matrix.rev }}
        run: svn export -q -r ${{ matrix.rev }} https://svn.code.sf.net/p/scidvspc/code scid

      - name: Apply patch
        if: github.event.inputs.patch != ''
        run: cd scid && patch -p1 < ../patches/${{ github.event.inputs.patch }}

      - name: Build
        run: |
          cd scid
          F=/Library/Frameworks
          ./configure TCL_INCLUDE="-I$F/Tcl.framework/Headers -I$F/Tk.framework/Headers" \
            TCL_LIBRARY="-F$F -framework Tcl" TK_LIBRARY="-F$F -framework Tcl -framework Tk"
          make -j4 scid tkscid tcscid
          otool -L tkscid tcscid
          echo 'puts "Tk [info patchlevel] [tk windowingsystem]"; exit' > /tmp/v.tcl
          ./tkscid /tmp/v.tcl

      - name: Test (started from the terminal)
        run: |
          ACTS="games both"; [ ${{ matrix.rev }} -lt 3720 ] && ACTS="games"
          N=r${{ matrix.rev }}-tk${{ matrix.tk }}-${{ matrix.os }}
          for dlg in tk native; do for act in $ACTS; do
            bash test/run.sh scid $N-term-$act-$dlg $act $dlg term
          done; done

      - name: Build ScidvsMac.app with embedded frameworks
        run: bash test/mkapp.sh scid

      - name: Test (ScidvsMac.app started with open)
        run: |
          ACTS="games both"; [ ${{ matrix.rev }} -lt 3720 ] && ACTS="games"
          N=r${{ matrix.rev }}-tk${{ matrix.tk }}-${{ matrix.os }}
          for dlg in tk native; do for act in $ACTS; do
            bash test/run.sh scid $N-app-$act-$dlg $act $dlg app
          done; done
          cat logs/summary.txt

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-r${{ matrix.rev }}-tk${{ matrix.tk }}-${{ matrix.os }}
          path: |
            logs
            shots
